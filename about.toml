# Keep this list aligned with deny.toml. The first compatible license is used
# when a dependency offers a choice.
accepted = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
]

targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

# Build and development dependencies are not linked into release binaries.
ignore-build-dependencies = true
ignore-dev-dependencies = true
ignore-transitive-dependencies = false
