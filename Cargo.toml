[package]
name = "onionloom"
version = "1.0.1"
edition = "2024"
rust-version = "1.85"
authors = ["chrisch88dev <chris@chrisch88.dev>"]
description = "Tor v3 onion vanity address generator with automatic CPU and GPU tuning"
license = "Apache-2.0"
repository = "https://github.com/chrisch88dev/onionloom"
homepage = "https://chrisch88.dev"
readme = "README.md"
build = "build.rs"
keywords = ["tor", "onion", "vanity", "ed25519", "cli"]
categories = ["command-line-utilities", "cryptography"]

[features]
default = ["gpu"]
gpu = ["dep:pollster", "dep:wgpu"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
curve25519-dalek = { version = "5.0", features = ["precomputed-tables", "zeroize"] }
getrandom = "0.4"
pollster = { version = "1.0", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha3 = "0.12"
wgpu = { version = "26.0", default-features = false, features = ["std", "dx12", "metal", "vulkan", "wgsl"], optional = true }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
opt-level = 3
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 1
lto = "fat"
panic = "abort"
strip = "symbols"
incremental = false

[profile.bench]
inherits = "release"
debug = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
