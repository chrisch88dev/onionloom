[package]
name = "onionloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Fast, measured, CPU-first Tor v3 onion vanity address generator"
license = "MIT"
repository = "https://github.com/chrisch88dev/onionloom"
readme = "README.md"
keywords = ["tor", "onion", "vanity", "ed25519", "cli"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
curve25519-dalek = { version = "5.0", features = ["precomputed-tables", "zeroize"] }
getrandom = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sha3 = "0.12"
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
debug = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
cast_precision_loss = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
similar_names = "allow"
too_many_lines = "allow"
verbose_bit_mask = "allow"
