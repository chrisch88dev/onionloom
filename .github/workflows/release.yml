name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/onionloom
          smoke_directory=$(mktemp -d "${RUNNER_TEMP}/onionloom-release.XXXXXX")
          trap 'rm -rf -- "$smoke_directory"' EXIT
          "$binary" evaluate --power low --trial-ms 25
          "$binary" benchmark --workers 1 --batch-size 8192 --trial-ms 25
          "$binary" search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 \
            --output "$smoke_directory/keys" --quiet
          "$binary" verify "$smoke_directory/keys"
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          asset="onionloom-${GITHUB_REF_NAME}-linux-x86_64"
          package="package-staging/$asset"
          mkdir -p release-assets "$package"
          cp target/release/onionloom "release-assets/$asset"
          chmod 0755 "release-assets/$asset"
          cp target/release/onionloom "$package/onionloom"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md "$package/"
          rust_copyright="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          test -f "$rust_copyright"
          cp "$rust_copyright" "$package/RUST_COPYRIGHT.html"
          cp -R docs "$package/docs"
          tar -C package-staging -czf "release-assets/${asset}.tar.gz" "$asset"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: release-assets/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = './target/release/onionloom.exe'
          $smokeDirectory = Join-Path $env:RUNNER_TEMP ("onionloom-release-" + [guid]::NewGuid())
          try {
            & $binary evaluate --power low --trial-ms 25
            & $binary benchmark --workers 1 --batch-size 8192 --trial-ms 25
            & $binary search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 `
              --output (Join-Path $smokeDirectory 'keys') --quiet
            & $binary verify (Join-Path $smokeDirectory 'keys')
          } finally {
            if (Test-Path -LiteralPath $smokeDirectory) {
              Remove-Item -LiteralPath $smokeDirectory -Recurse -Force
            }
          }
      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = "onionloom-$env:GITHUB_REF_NAME-windows-x86_64"
          $releaseAssets = 'release-assets'
          $package = Join-Path 'package-staging' $asset
          New-Item -ItemType Directory -Path $releaseAssets,'package-staging' | Out-Null
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/onionloom.exe (Join-Path $releaseAssets "$asset.exe")
          Copy-Item target/release/onionloom.exe (Join-Path $package 'onionloom.exe')
          Copy-Item LICENSE,NOTICE,THIRD_PARTY_NOTICES.md,THIRD_PARTY_LICENSES.html,README.md,SECURITY.md,CHANGELOG.md,CONTRIBUTING.md -Destination $package
          $rustCopyright = Join-Path (rustc --print sysroot) 'share/doc/rust/COPYRIGHT-library.html'
          if (-not (Test-Path -LiteralPath $rustCopyright)) {
            throw "Rust standard-library copyright file not found: $rustCopyright"
          }
          Copy-Item $rustCopyright (Join-Path $package 'RUST_COPYRIGHT.html')
          Copy-Item docs -Destination (Join-Path $package 'docs') -Recurse
          Compress-Archive -Path $package -DestinationPath (Join-Path $releaseAssets "$asset.zip")
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64
          path: release-assets/*
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          lipo -create \
            target/aarch64-apple-darwin/release/onionloom \
            target/x86_64-apple-darwin/release/onionloom \
            -output "release-assets/onionloom-${GITHUB_REF_NAME}-macos-universal"
          chmod 0755 "release-assets/onionloom-${GITHUB_REF_NAME}-macos-universal"
          lipo -info "release-assets/onionloom-${GITHUB_REF_NAME}-macos-universal"
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="./release-assets/onionloom-${GITHUB_REF_NAME}-macos-universal"
          smoke_directory=$(mktemp -d "${RUNNER_TEMP}/onionloom-release.XXXXXX")
          trap 'rm -rf -- "$smoke_directory"' EXIT
          "$binary" evaluate --power low --trial-ms 25
          "$binary" benchmark --workers 1 --batch-size 8192 --trial-ms 25
          "$binary" search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 \
            --output "$smoke_directory/keys" --quiet
          "$binary" verify "$smoke_directory/keys"
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          asset="onionloom-${GITHUB_REF_NAME}-macos-universal"
          version="${GITHUB_REF_NAME#v}"
          binary="release-assets/$asset"
          package="package-staging/$asset"
          mkdir -p "$package"
          cp "$binary" "$package/onionloom"
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md "$package/"
          rust_copyright="$(rustc --print sysroot)/share/doc/rust/COPYRIGHT-library.html"
          test -f "$rust_copyright"
          cp "$rust_copyright" "$package/RUST_COPYRIGHT.html"
          cp -R docs "$package/docs"
          tar -C package-staging -czf "release-assets/${asset}.tar.gz" "$asset"
          hdiutil create \
            -volname "Onionloom $version" \
            -srcfolder "$package" \
            -fs HFS+ \
            -format UDZO \
            -ov "release-assets/${asset}.dmg"
          hdiutil verify "release-assets/${asset}.dmg"

          mount_directory=$(mktemp -d "${RUNNER_TEMP}/onionloom-dmg.XXXXXX")
          mounted=false
          cleanup() {
            if [[ "$mounted" == true ]]; then
              hdiutil detach "$mount_directory" || true
            fi
            rmdir "$mount_directory" 2>/dev/null || true
          }
          trap cleanup EXIT

          hdiutil attach -readonly -nobrowse \
            -mountpoint "$mount_directory" "release-assets/${asset}.dmg" >/dev/null
          mounted=true
          while IFS= read -r -d '' source; do
            relative="${source#"$package"/}"
            test -f "$mount_directory/$relative"
            cmp "$source" "$mount_directory/$relative"
          done < <(find "$package" -type f -print0)
          hdiutil detach "$mount_directory"
          mounted=false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-universal
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          export LC_ALL=C
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Onionloom $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
