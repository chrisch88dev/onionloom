name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: target/release/onionloom version
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="onionloom-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$package"
          install -m 0755 target/release/onionloom "$package/onionloom"
          install -m 0644 README.md SECURITY.md LICENSE NOTICE "$package/"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: onionloom-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: target/release/onionloom.exe version
      - name: Package
        shell: pwsh
        run: |
          $package = "onionloom-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/onionloom.exe "$package/onionloom.exe"
          Copy-Item README.md,SECURITY.md,LICENSE,NOTICE $package
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: onionloom-*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          package="onionloom-${GITHUB_REF_NAME}-macos-universal"
          mkdir "$package"
          lipo -create \
            target/aarch64-apple-darwin/release/onionloom \
            target/x86_64-apple-darwin/release/onionloom \
            -output "$package/onionloom"
          chmod 0755 "$package/onionloom"
          lipo -info "$package/onionloom"
          "$package/onionloom" version
          install -m 0644 README.md SECURITY.md LICENSE NOTICE "$package/"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: onionloom-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum onionloom-* > SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Onionloom $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
