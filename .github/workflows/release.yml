name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Match tag to Cargo version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "$GITHUB_REF_NAME" = "v$version"

  linux:
    name: Linux x86_64
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          binary=target/release/onionloom
          smoke_directory=$(mktemp -d "${RUNNER_TEMP}/onionloom-release.XXXXXX")
          trap 'rm -rf -- "$smoke_directory"' EXIT
          "$binary" evaluate --power low --trial-ms 25
          "$binary" benchmark --workers 1 --batch-size 8192 --trial-ms 25
          "$binary" search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 \
            --output "$smoke_directory/keys" --quiet
          "$binary" verify "$smoke_directory/keys"
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          package="onionloom-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$package"
          cp target/release/onionloom "$package/onionloom"
          cp LICENSE NOTICE README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md "$package/"
          cp -R docs "$package/docs"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: onionloom-*.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - name: Smoke release binary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $binary = './target/release/onionloom.exe'
          $smokeDirectory = Join-Path $env:RUNNER_TEMP ("onionloom-release-" + [guid]::NewGuid())
          try {
            & $binary evaluate --power low --trial-ms 25
            & $binary benchmark --workers 1 --batch-size 8192 --trial-ms 25
            & $binary search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 `
              --output (Join-Path $smokeDirectory 'keys') --quiet
            & $binary verify (Join-Path $smokeDirectory 'keys')
          } finally {
            if (Test-Path -LiteralPath $smokeDirectory) {
              Remove-Item -LiteralPath $smokeDirectory -Recurse -Force
            }
          }
      - name: Package release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = "onionloom-$env:GITHUB_REF_NAME-windows-x86_64"
          New-Item -ItemType Directory -Path $package | Out-Null
          Copy-Item target/release/onionloom.exe (Join-Path $package 'onionloom.exe')
          Copy-Item LICENSE,NOTICE,README.md,SECURITY.md,CHANGELOG.md,CONTRIBUTING.md -Destination $package
          Copy-Item docs -Destination (Join-Path $package 'docs') -Recurse
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: onionloom-*.zip
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build both architectures
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Create universal binary
        shell: bash
        run: |
          set -euo pipefail
          lipo -create \
            target/aarch64-apple-darwin/release/onionloom \
            target/x86_64-apple-darwin/release/onionloom \
            -output "onionloom-${GITHUB_REF_NAME}-macos-universal"
          chmod 0755 "onionloom-${GITHUB_REF_NAME}-macos-universal"
          lipo -info "onionloom-${GITHUB_REF_NAME}-macos-universal"
      - name: Smoke release binary
        shell: bash
        run: |
          set -euo pipefail
          binary="./onionloom-${GITHUB_REF_NAME}-macos-universal"
          smoke_directory=$(mktemp -d "${RUNNER_TEMP}/onionloom-release.XXXXXX")
          trap 'rm -rf -- "$smoke_directory"' EXIT
          "$binary" evaluate --power low --trial-ms 25
          "$binary" benchmark --workers 1 --batch-size 8192 --trial-ms 25
          "$binary" search aa --gpu off --workers 1 --batch-size 64 --tune-ms 25 \
            --output "$smoke_directory/keys" --quiet
          "$binary" verify "$smoke_directory/keys"
      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          package="onionloom-${GITHUB_REF_NAME}-macos-universal"
          binary="$package"
          mkdir package-staging
          mv "$binary" package-staging/onionloom
          cp LICENSE NOTICE README.md SECURITY.md CHANGELOG.md CONTRIBUTING.md package-staging/
          cp -R docs package-staging/docs
          mv package-staging "$package"
          tar -czf "${package}.tar.gz" "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: onionloom-*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Onionloom $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
